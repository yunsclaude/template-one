# EC2 자동 배포입니다.
# main 브랜치에 Push 하면 GitHub 이 검사를 먼저 돌리고, 통과했을 때만 EC2 로 배포합니다.
#
# 이 파일에는 서버 주소, 계정 이름, SSH 개인키를 절대 직접 적지 마세요.
# 세 값 모두 GitHub 저장소의 Settings > Secrets and variables > Actions 에 등록해서 씁니다.
#   DEPLOY_HOST     EC2 공인 IPv4 또는 접속 가능한 호스트 이름
#   DEPLOY_USER     EC2 접속 계정 (Amazon Linux 는 보통 ec2-user)
#   DEPLOY_SSH_KEY  EC2 의 authorized_keys 에 등록된 공개키와 짝을 이루는 개인키
name: Deploy to EC2

on:
  push:
    branches: [main]
  # Actions 탭에서 버튼으로 직접 실행할 수도 있습니다.
  workflow_dispatch:

# 배포는 도중에 끊기면 서버가 어중간한 상태로 남습니다.
# 그래서 연속 Push 때 앞선 실행을 취소하지 않고, 순서대로 기다리게 합니다.
concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: false

# 이 워크플로는 코드를 읽기만 하면 됩니다.
permissions:
  contents: read

env:
  # EC2 안에서 모든 프로젝트가 들어가는 상위 폴더입니다.
  REMOTE_ROOT: /srv/company-ai/projects
  # compose.yaml 에 정의된 서비스 이름입니다.
  APP_SERVICE: app
  # EC2 안에서 확인하는 상태 점검 주소입니다.
  HEALTH_URL: http://127.0.0.1:3000/api/health
  # 모든 ssh / rsync 가 함께 쓰는 접속 옵션입니다.
  # BatchMode=yes         비밀번호를 물어보지 않고 바로 실패합니다 (워크플로가 멈추지 않게).
  # StrictHostKeyChecking=yes  아래에서 등록한 호스트 키와 다르면 접속하지 않습니다.
  SSH_OPTS: -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15

jobs:
  deploy:
    name: 검사 후 EC2 배포
    runs-on: ubuntu-latest

    steps:
      # 외부 액션은 GitHub 공식 액션(actions/*)만 사용합니다.
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: Node.js 22 설정
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # validate.yml 에서도 검사하지만, 배포 워크플로가 스스로 안전장치를 갖도록 여기서도 검사합니다.
      # 검사가 실패하면 아래 배포 단계는 실행되지 않습니다.
      - name: 프로젝트 검사
        run: npm run check

      # 저장소 이름이 그대로 서버 경로가 되므로, 이상한 문자가 섞여 있지 않은지 확인합니다.
      - name: 저장소 이름 확인 및 배포 경로 결정
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # 영문 대소문자, 숫자, 하이픈, 밑줄, 점만 허용합니다.
          if [[ ! "$REPO_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::저장소 이름에 허용되지 않는 문자가 있어 배포를 중단합니다."
            exit 1
          fi

          # "." 과 ".." 은 상위 폴더를 가리키므로 경로로 쓸 수 없습니다.
          if [[ "$REPO_NAME" == "." || "$REPO_NAME" == ".." ]]; then
            echo "::error::저장소 이름을 폴더 이름으로 쓸 수 없어 배포를 중단합니다."
            exit 1
          fi

          echo "REMOTE_DIR=${REMOTE_ROOT}/${REPO_NAME}" >> "$GITHUB_ENV"
          echo "배포 대상 폴더: ${REMOTE_ROOT}/${REPO_NAME}"

      # 개인키는 파일로 만들되, 화면(로그)에는 절대 출력하지 않습니다.
      - name: SSH 접속 준비
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_HOST 또는 DEPLOY_SSH_KEY Secret 이 비어 있습니다."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # umask 077 로 만들어 다른 사용자가 읽을 수 없게 합니다. 내용은 출력하지 않습니다.
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 서버의 호스트 키를 미리 등록해 두면, 접속할 때 "정말 접속할까요?" 를 묻지 않습니다.
          # -H 는 등록되는 주소를 해시로 감춥니다.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::EC2 호스트 키를 가져오지 못했습니다. DEPLOY_HOST 값과 보안 그룹의 22번 포트를 확인하세요."
            exit 1
          fi

          echo "SSH 준비 완료"

      - name: EC2 프로젝트 폴더 준비
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          # 아래 <<'REMOTE' 는 따옴표가 있으므로 GitHub 쪽에서 변수를 바꾸지 않고 그대로 EC2 에 보냅니다.
          # 그래서 스크립트 안의 $REMOTE_DIR 은 EC2 에서 풀립니다.
          # EC2 에 전달할 값은 bash -s 앞에 붙여서 넘깁니다.
          # shellcheck disable=SC2086
          ssh -i "$HOME/.ssh/deploy_key" $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$REMOTE_DIR"
          cd "$REMOTE_DIR"
          echo "프로젝트 폴더 준비 완료: $(pwd)"
          REMOTE

      # 변경된 파일만 골라서 EC2 로 보냅니다.
      # --delete 는 GitHub 에서 지운 파일을 EC2 에서도 지웁니다.
      # 단, --exclude 로 뺀 항목은 --delete 대상에서도 빠지므로
      # EC2 의 .env, data/, uploads/, logs/ 는 그대로 보존됩니다.
      - name: 프로젝트 파일 전송 (rsync)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          rsync -az --delete --human-readable \
            -e "ssh -i $HOME/.ssh/deploy_key $SSH_OPTS" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.production' \
            --exclude='.env.*.local' \
            --exclude='data/' \
            --exclude='uploads/' \
            --exclude='logs/' \
            --exclude='npm-debug.log*' \
            --exclude='yarn-error.log*' \
            --exclude='*.log' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='*.swp' \
            --exclude='*.swo' \
            --exclude='*~' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_DIR/"

          echo "파일 전송 완료"

      - name: EC2 에서 Docker 실행
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2086
          ssh -i "$HOME/.ssh/deploy_key" $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' APP_SERVICE='$APP_SERVICE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$REMOTE_DIR"

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker 명령을 찾을 수 없습니다. EC2 에 Docker 를 설치하세요." >&2
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose 를 쓸 수 없습니다. Docker Compose v2 플러그인을 설치하세요." >&2
            exit 1
          fi

          if [ ! -f Dockerfile ]; then
            echo "Dockerfile 이 없습니다." >&2
            exit 1
          fi

          if [ ! -f compose.yaml ]; then
            echo "compose.yaml 이 없습니다." >&2
            exit 1
          fi

          echo "--- compose 설정 문법 검사 ---"
          docker compose config >/dev/null
          echo "문법 이상 없음"

          echo "--- 빌드 및 실행 ---"
          docker compose up -d --build --remove-orphans

          echo "--- 컨테이너 상태 ---"
          docker compose ps

          echo "--- 최근 로그 100줄 ---"
          docker compose logs --tail=100 "$APP_SERVICE"
          REMOTE

      # 컨테이너가 떴다고 해서 앱이 정상이라는 뜻은 아닙니다. 실제 응답을 확인합니다.
      - name: Health Check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2086
          ssh -i "$HOME/.ssh/deploy_key" $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' APP_SERVICE='$APP_SERVICE' HEALTH_URL='$HEALTH_URL' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$REMOTE_DIR"

          # 5초 간격으로 최대 12번 = 최대 60초 기다립니다.
          max_attempts=12
          attempt=0

          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt + 1))

            body_file="$(mktemp)"
            # -o 로 본문을 파일에 담고, -w 로 HTTP 상태 코드만 화면으로 받습니다.
            # 접속 자체가 실패하면 000 으로 처리합니다.
            status_code="$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 5 "$HEALTH_URL" 2>/dev/null || echo '000')"

            if [ "$status_code" = "200" ]; then
              echo "Health Check 성공 (HTTP 200, ${attempt}번째 시도)"
              echo "응답 본문:"
              cat "$body_file"
              echo
              rm -f "$body_file"
              exit 0
            fi

            echo "아직 준비되지 않았습니다 (${attempt}/${max_attempts}, HTTP ${status_code})"
            rm -f "$body_file"

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep 5
            fi
          done

          echo "Health Check 실패: 60초 안에 HTTP 200 을 받지 못했습니다." >&2
          echo "--- 최근 로그 200줄 ---" >&2
          docker compose logs --tail=200 "$APP_SERVICE" >&2 || true
          exit 1
          REMOTE

      # 성공하든 실패하든 임시 개인키 파일을 반드시 지웁니다.
      - name: 임시 SSH 키 삭제
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
